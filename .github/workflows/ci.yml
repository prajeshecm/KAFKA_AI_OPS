name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Same checks as pre-commit, so nothing can skip them
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1   # installs and runs every hook

  # Build and test both Spring apps
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [producer, consumer]        # runs the job once per app, in parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven                   # reuse downloaded dependencies between runs
      - name: Maven verify
        working-directory: platform/apps/${{ matrix.app }}
        run: ./mvnw -B verify
