spring.application.name=producer
server.port=8081

# EXTERNAL listener, because the app runs on your laptop for now
spring.kafka.bootstrap-servers=localhost:9092

# Keys and values are plain strings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Safe delivery: wait for all in-sync replicas; no duplicates on retry
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Expose health and metrics (we'll use these in A4)
management.endpoints.web.exposure.include=health,prometheus


# The topic and its partition count live in config, so a PR can change them
app.topic=orders
app.topic-partitions=3