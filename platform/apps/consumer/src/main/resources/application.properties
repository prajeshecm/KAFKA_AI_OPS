spring.application.name=consumer
server.port=8082

spring.kafka.bootstrap-servers=localhost:9092

# The consumer group: all instances with this ID share the partitions
spring.kafka.consumer.group-id=orders-consumer

# New group with no committed offset: read from the oldest message
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 3 threads, one per partition
spring.kafka.listener.concurrency=3

# Configurable processing delay in ms; our fault scripts will raise it later
app.processing-delay-ms=0

management.endpoints.web.exposure.include=health,prometheus