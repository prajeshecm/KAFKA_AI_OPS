services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka_kraft
    hostname: kafka
    ports:
      - "9092:9092"            # for tools on your laptop
    environment:
      # This node is broker AND controller (dev only)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Three listeners: one per kind of client
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # One broker, so internal topics can only have 1 replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Fixed cluster ID, so restarted containers match the stored data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    
    volumes:
      - kafka-data:/var/lib/kafka/data
    
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:29092"]   # INTERNAL listener: container to container
    ports: ["9308:9308"]
    depends_on: [kafka]
    restart: unless-stopped                   # retry if Kafka isn't ready yet

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]                      # login admin / admin
    depends_on: [prometheus]
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports: ["9093:9093"]

  webhook-echo:
    # Logs every request it receives, so we can see the alert JSON
    image: mendhak/http-https-echo:latest   # pin a version from Docker Hub later
    environment:
      HTTP_PORT: 8080

volumes:
    kafka-data: